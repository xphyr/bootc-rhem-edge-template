# Redis for zot, single node inside the zot pod.
# Port 6379 is not published from the pod, so only zot can reach it.
bind 127.0.0.1 -::1
port 6379
protected-mode yes

dir /data

# AOF for durability, RDB snapshots for backups (dump.rdb)
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000
