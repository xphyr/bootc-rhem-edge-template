apiVersion: 1

providers:
  # Default dashboards folder
  - name: "Default"
    orgId: 1
    folder: ""  # Root folder
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30  # Check for changes every 30s
    allowUiUpdates: false      # Prevent UI modifications
    options:
      path: /etc/grafana/provisioning/dashboards/default
