apiVersion: 1
datasources:
  # Prometheus for metrics. The monitoring fleet runs Prometheus on the same
  # host; point this at an external Prometheus instead if you have one.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"

  # Loki for logs. Loki is not deployed by this repo; run it wherever you like
  # and update the URL (the same one used in bootc/etc/alloy/conf.d/00-base.alloy).
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki.example.com:3100
    editable: false
    jsonData:
      maxLines: 1000
      timeout: 60
