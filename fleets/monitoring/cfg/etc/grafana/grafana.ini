[server]
domain   = grafana.example.com
root_url = https://grafana.example.com/

[auth]
disable_login_form = false

; Optional: single sign-on with any OpenID Connect provider (Keycloak, Kanidm,
; Authentik, ...). Uncomment and fill in. The client secret is NOT set here: it
; comes from GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET in the sops-encrypted
; /etc/sops/grafana/grafana.sops.env, rendered by sops-render@grafana.
;[auth.generic_oauth]
;enabled    = true
;name       = SSO
;client_id  = grafana
;scopes     = openid profile email groups
;auth_url   = https://idp.example.com/oauth2/authorize
;token_url  = https://idp.example.com/oauth2/token
;api_url    = https://idp.example.com/oauth2/userinfo
;use_pkce   = true
;use_refresh_token = true
;allow_sign_up     = true
;login_attribute_path  = preferred_username
;name_attribute_path   = name
;email_attribute_path  = email
;groups_attribute_path = groups
;role_attribute_path   = contains(groups[*], 'grafana-admins') && 'Admin' || 'Viewer'

[recording_rules]
enabled = true
timeout = 30s
