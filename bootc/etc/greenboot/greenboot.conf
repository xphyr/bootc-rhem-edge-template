# Greenboot configuration file
# Shipped by the base image (bootc/etc/greenboot/greenboot.conf); replaces the
# greenboot package default.

## Generic
GREENBOOT_MAX_BOOT_ATTEMPTS=3


### Multiple healthchecks may be skipped by separating
### the script names with spaces.
### NOTE: Script names must be spelled EXACTLY. Typos will result in
### unwanted behavior.
### DISABLED_HEALTHCHECKS=("01_repository_dns_check.sh" "02_watchdog.sh")

# 01_update_platforms_check.sh looks for ostree remotes in /etc/ostree/remotes.d.
# bootc devices update from a container registry and have no ostree remotes,
# so this check fails on every boot without meaning anything.
DISABLED_HEALTHCHECKS=("01_update_platforms_check.sh")
